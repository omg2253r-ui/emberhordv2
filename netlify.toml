# Emberhold on Netlify. The game is packed in emberhold-game.tar.gz (so the repository is only three files):
# the build unpacks it, copies the browser files into dist/, and Netlify bundles the online functions.
[build]
  command = "tar -xzf emberhold-game.tar.gz && node tools/build-site.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Security headers for every page (shared by netlify.toml and the GitHub upload bundle).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
